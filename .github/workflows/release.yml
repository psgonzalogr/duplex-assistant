name: Compilar y publicar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: release/Duplex-Assistant-Setup-*.exe
          - os: ubuntu-latest
            script: dist:linux
            files: release/Duplex-Assistant-*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Duplex Assistant ${{ github.ref_name }}
          files: dist/*
          body: |
            **Duplex Assistant** imprime a doble cara en impresoras sin dúplex automático. Desarrollado por [SafeTech](https://safe-tech.cl).

            ### Instalar en Windows (PowerShell)
            ```powershell
            irm https://raw.githubusercontent.com/psgonzalogr/duplex-assistant/main/install.ps1 | iex
            ```
            O descarga `Duplex-Assistant-Setup-*.exe` y ábrelo.

            ### Instalar en Linux (terminal)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/psgonzalogr/duplex-assistant/main/install.sh | bash
            ```
            O descarga el `.AppImage`, dale permiso de ejecución y ábrelo.
